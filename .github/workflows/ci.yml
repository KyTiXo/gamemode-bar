name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check.sh
      - name: Shellcheck install script
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck install.sh
          else
            brew install shellcheck
            shellcheck install.sh
          fi
      - name: Register in-repo tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/kytixo"
          ln -sfn "${{ github.workspace }}" "$(brew --repository)/Library/Taps/kytixo/homebrew-gamemode-bar"
      - name: Lint Homebrew cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew style --cask kytixo/gamemode-bar/gamemode-bar
          brew audit --cask kytixo/gamemode-bar/gamemode-bar
