name: Generate README

on:
  push:
    branches: [main]
    paths: ['.github/readme.source.md']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=npm depName=readme-aura
  READMEAURA_VERSION: 1.0.20

jobs:
  # Mirrors collectioneur/readme-aura's action.yml, but pinned and read-only: npm code never sees a write token.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes "readme-aura@$READMEAURA_VERSION" build \
            --source .github/readme.source.md \
            --output README.md \
            --assets .github/assets \
            --github-user "$GITHUB_REPOSITORY_OWNER" \
            --github-token "$GITHUB_TOKEN"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme
          path: |
            README.md
            .github/assets/
          include-hidden-files: true
          if-no-files-found: error

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Replace, not merge, so SVGs readme-aura pruned stay deleted.
      - run: rm -rf README.md .github/assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "regenerate README via readme-aura"
            git push
          fi
