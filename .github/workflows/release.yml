name: Release

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Package app
        run: ditto -c -k --keepParent "build/Game Mode Bar.app" "Game-Mode-Bar-${GITHUB_REF_NAME}.zip"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "Game Mode Bar ${GITHUB_REF_NAME}" \
            --notes "Beta build (unsigned ad-hoc). Gatekeeper may prompt on first open. Use Check Permissions for Xcode and No AirDrop prerequisites." \
            "Game-Mode-Bar-${GITHUB_REF_NAME}.zip"
