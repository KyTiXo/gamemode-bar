name: Release

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag matches Info.plist version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Packaging/Info.plist)
          if [ "$TAG" != "$PLIST_VERSION" ]; then
            echo "Tag version $TAG does not match Packaging/Info.plist ($PLIST_VERSION)" >&2
            exit 1
          fi
      - run: scripts/check.sh
      - run: scripts/build-app.sh
      - name: Package app
        run: ditto -c -k --keepParent "build/Game Mode Bar.app" "Game-Mode-Bar-${GITHUB_REF_NAME}.zip"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "Game Mode Bar ${GITHUB_REF_NAME}" \
            --notes "Beta build (ad-hoc signed, not notarized). Gatekeeper may prompt on first open — right-click the app and choose Open if needed. Use Settings → Check Permissions for Xcode and No AirDrop prerequisites." \
            "Game-Mode-Bar-${GITHUB_REF_NAME}.zip"
      - name: Bump Homebrew cask on main
        run: |
          ZIP="Game-Mode-Bar-${GITHUB_REF_NAME}.zip"
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          scripts/update-cask.sh "$VERSION" "$SHA256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gamemode-bar.rb
          git diff --staged --quiet || git commit -m "chore: bump Homebrew cask to v${VERSION}"
          git push origin main
      - name: Smoke install cask from release
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/kytixo"
          ln -sfn "${{ github.workspace }}" "$(brew --repository)/Library/Taps/kytixo/homebrew-gamemode-bar"
          brew trust kytixo/gamemode-bar
          brew install --cask gamemode-bar
          brew uninstall --cask gamemode-bar
